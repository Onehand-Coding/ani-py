name: live-check

# Weekly proof that the providers still answer: search, episodes, AND
# first-episode resolve, against the real network. Unit tests use mocked
# HTTP only, so without this a backend can rot unnoticed (e.g. AniLight
# 2026.10.11, where search stayed green while /sources went 403).
#
# Deliberately NOT on push/pull_request: third-party sites flap and
# rate-limit, so this must never block a merge. A red run means "go look":
# rerun ./scripts/check-providers-live.sh locally, then fix in the one
# provider class that owns the breakage.
on:
  schedule:
    # Mondays 06:00 UTC. Scheduled runs only fire on the default branch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Probe live providers
        # One retry absorbs transient CDN stalls/rate limits; a real
        # outage fails twice and gets reported below.
        run: |
          ./scripts/check-providers-live.sh || (
            sleep 120 && ./scripts/check-providers-live.sh
          )

      - name: File an issue on failure
        if: failure()
        # pinned to v7
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = "Live provider check is failing";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Weekly probe failed: ${new Date().toISOString()}.`,
              ``,
              `Run log: ${runUrl}`,
              ``,
              `Reproduce: \`./scripts/check-providers-live.sh\`.`,
              `Then fix the owning provider class.`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
