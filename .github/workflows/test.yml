name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check installer scripts
        run: sh -n install.sh uninstall.sh

      - name: Compile
        run: python -m py_compile ani_py.py ani-py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone script
        run: ./scripts/build-standalone.sh

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ani-py-release-main
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check whether distributable files changed
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$latest_tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force origin "refs/tags/$latest_tag:refs/tags/$latest_tag" 2>/dev/null || true
          latest_sha=$(git rev-list -n 1 "$latest_tag" 2>/dev/null || true)
          if [ -z "$latest_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$GITHUB_SHA" "$latest_sha"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$latest_sha" "$GITHUB_SHA" | grep -Eq '^(ani_py\.py|install\.sh|uninstall\.sh|scripts/build-standalone\.sh|\.github/workflows/test\.yml)$'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.publish == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build release assets
        if: steps.changes.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-standalone.sh
          cp install.sh uninstall.sh dist/
          (
            cd dist
            sha256sum ani-py install.sh uninstall.sh > SHA256SUMS
          )

      - name: Publish checksummed release snapshot
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import ani_py; print(ani_py.VERSION)')
          short_sha=${TESTED_SHA:0:7}
          tag="release-${version}-${short_sha}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" dist/ani-py dist/install.sh dist/uninstall.sh dist/SHA256SUMS \
            --target "$TESTED_SHA" \
            --title "ani-py ${version} (${short_sha})" \
            --notes "Automated release snapshot from tested main commit ${TESTED_SHA}." \
            --latest
